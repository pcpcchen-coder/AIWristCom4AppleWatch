name: AIWristCom
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '18.0'
    watchOS: '11.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  AIWristCompanion:
    type: application
    platform: iOS
    sources:
      - path: iPhoneApp
        excludes: [README.md]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIWRIST_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Config/iPhone-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AIWrist Companion
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 連接您設定的開發期 Codex provider host。
    dependencies:
      - target: AIWristWatch
        embed: true
  AIWristWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes: [README.md]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIWRIST_BUNDLE_ID).watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 小克
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(AIWRIST_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        NSMicrophoneUsageDescription: AIWristCom 使用麥克風接收您的語音問題。
  AIWristCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/CoreTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIWRIST_BUNDLE_ID).tests
schemes:
  AIWristCompanion:
    build:
      targets:
        AIWristCompanion: all
    test:
      targets: [AIWristCoreTests]
  AIWristWatch:
    build:
      targets:
        AIWristWatch: all
